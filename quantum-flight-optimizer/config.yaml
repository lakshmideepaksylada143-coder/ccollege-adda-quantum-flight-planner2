# AeroQ-Route Configuration File
# Fixed seeds ensure scientific reproducibility across all benchmarks
seed: 42
num_nodes: 20
num_flights: 10
capacity_per_edge: 2

# Penalty weights for QUBO formulation
# P_path: Penalty for broken/discontinuous flight trajectories (Hard constraint - must exceed max flight fuel)
# P_cap: Penalty for exceeding edge capacity / simultaneous bottleneck conflicts (Soft constraint)
penalty_path: 25000.0
penalty_cap: 2000.0

# Indian Airspace Hub Coordinates (Longitude, Latitude)
# Coordinate system: [Longitude (deg East), Latitude (deg North)]
airports:
  DEL: [77.1025, 28.7041]   # Indira Gandhi International (Delhi)
  BOM: [72.8777, 19.0760]   # Chhatrapati Shivaji Maharaj (Mumbai)
  HYD: [78.4867, 17.3850]   # Rajiv Gandhi International (Hyderabad)
  BLR: [77.5946, 12.9716]   # Kempegowda International (Bengaluru)
  MAA: [80.2707, 13.0827]   # Chennai International (Chennai)
  CCU: [88.3639, 22.5726]   # Netaji Subhash Chandra Bose (Kolkata)
  VTZ: [83.2242, 17.6868]   # Visakhapatnam Airport (Vizag)

# Commercial Aircraft Specific Fuel Consumption Rates (kg fuel per km)
aircraft_specs:
  A320neo:
    name: "Airbus A320neo"
    fuel_rate: 4.5
    cruise_speed_kmh: 840
    wake_cat: "Medium"
  B737-800:
    name: "Boeing 737-800"
    fuel_rate: 5.0
    cruise_speed_kmh: 830
    wake_cat: "Medium"
  A321neo:
    name: "Airbus A321neo"
    fuel_rate: 5.8
    cruise_speed_kmh: 845
    wake_cat: "Medium"
  ATR72:
    name: "ATR 72-600"
    fuel_rate: 2.8
    cruise_speed_kmh: 510
    wake_cat: "Light"
  B787-9:
    name: "Boeing 787-9 Dreamliner"
    fuel_rate: 6.5
    cruise_speed_kmh: 900
    wake_cat: "Heavy"

# Environmental factors
co2_multiplier: 3.16  # ICAO standard: 3.16 kg CO2 produced per 1.0 kg Jet-A1 fuel

# Optimization Solvers Configuration
solvers:
  classical_k_candidates: 3
  annealer:
    num_reads: 150
    num_sweeps: 500
  qaoa:
    p_layers: 2
    max_qubits: 12
    shots: 1024
